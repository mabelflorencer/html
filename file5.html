<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Welcome to Contact Us page!</p>
    <form action="submit.html" method="post" target="_self">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter Your Name" maxlength="50" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter Your Email" required><br><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter Your Phone Number" pattern="[0-9]{10}" required><br><br>
        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Enter Your Subject" maxlength="100" required><br><br>
        <label for="message">Message:</label><br>
        <input type="text" id="message" name="message" placeholder="Enter Your Message"maxlength="500" required><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    <p>&copy; 2024 Contact Us. All rights reserved.</p>
</body>
</html>
