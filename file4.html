<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
</head>
<body>
    <p>Welcome to Newsletter!</p>
    <p>Here is Newsletter Signup</p>
    <form action="login.html" method="post" target="_self">
       <label for="fname">First Name:</label><br>
       <input type="text" id="fname" name="fname" required><br>
       <label for="mailid">Email:</label><br>
       <input type="email" id="mailid" name="mailid" required><br><br>
       <input type="checkbox" id="terms and conditions" name="terms_and_conditions" required>
       <label for="terms and conditions">I agree to the terms and conditions</label><br><br>
       <input type="submit" value="Submit">
       <p>&copy; 2024 Newsletter. All rights reserved.</p>
    </form>
</body>
</html>
